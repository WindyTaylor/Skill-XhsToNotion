<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收藏管理</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151716;
        --panel: #101315;
        --ink: #f2f2ee;
        --muted: #8e928d;
        --line: #2a3d59;
        --accent: #3b5cff;
        --accent-soft: #91a3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px 14px;
        background:
          radial-gradient(circle at 18% 0%, rgba(107, 86, 34, 0.18), transparent 38%),
          var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .console-entry {
        width: min(760px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .search-row {
        display: flex;
        align-items: center;
        min-width: 0;
        height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
      }

      .search-row input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 13px;
      }

      .search-row input::placeholder {
        color: var(--muted);
      }

      .launch-button {
        height: 40px;
        min-width: 104px;
        padding: 0 18px;
        border: 1px solid var(--accent);
        border-radius: 9px;
        background: rgba(59, 92, 255, 0.1);
        color: var(--accent-soft);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      .launch-button:hover,
      .launch-button:focus {
        background: rgba(59, 92, 255, 0.2);
        color: #e4e8ff;
      }

      @media (max-width: 560px) {
        body {
          min-height: 148px;
        }

        .console-entry {
          grid-template-columns: 1fr;
        }

        .launch-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <form class="console-entry" aria-label="小红书收藏管理入口" onsubmit="launchConsole(); return false;">
      <label class="search-row">
        <input type="search" aria-label="搜索" placeholder="搜索标题、简介、作者、标签" />
      </label>
      <button type="submit" class="launch-button" aria-label="打开收藏管理">收藏管理</button>
    </form>
    <script>
      function launchConsole() {
        var protocolUrl = "xhs-notion-console://start?mode=local";
        var localUrl = "http://127.0.0.1:8765";

        try {
          window.open(protocolUrl, "_blank", "noopener,noreferrer");
        } catch (error) {
          window.location.href = protocolUrl;
        }

        window.setTimeout(function () {
          window.open(localUrl, "_blank", "noopener,noreferrer");
        }, 1200);
      }
    </script>
  </body>
</html>
