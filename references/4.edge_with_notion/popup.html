<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书抓取助手</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <button id="open-dedicated-tab-btn" class="secondary-btn" style="width: 100%; margin-bottom: 15px; font-weight: bold; background-color: #f0f0f0; color: #333;">🖥️ 在独立网页中打开 (适合长文/专辑批量同步)</button>
        
        <h1>小红书抓取助手</h1>
        
        <div class="input-group">
            <label for="max-count">最大抓取数量:</label>
            <input type="number" id="max-count" value="50" min="1">
        </div>

        <div class="input-group">
            <label for="notion-token">Notion Integration Token:</label>
            <input type="password" id="notion-token" placeholder="secret_...">
        </div>

        <div class="input-group">
            <label for="database-id">Notion Database ID:</label>
            <input type="text" id="database-id" placeholder="填写Database的ID">
        </div>

        <div class="button-group">
            <button id="start-scrape-btn" class="primary-btn">开始抓取</button>
            <button id="pause-scrape-btn" class="secondary-btn" disabled>暂停抓取</button>
            <button id="sync-notion-btn" class="primary-btn" style="background-color: #2eaadc;">直接同步到 Notion</button>
            <button id="pause-sync-btn" class="secondary-btn" disabled>暂停同步</button>
            <div id="sync-status" class="status-text"></div>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label style="display: flex; align-items: center; cursor: pointer; font-weight: normal; color: #d93a00;">
                <input type="checkbox" id="incremental-mode-checkbox" style="width: auto; margin-right: 8px;">
                ⚡ 开启专辑增量同步模式 (遇到已存在记录自动停止)
            </label>
        </div>
        
        <div class="divider"></div>
        
        <div class="button-group">
            <button id="export-csv-btn" class="secondary-btn">导出为 CSV</button>
            <button id="export-html-btn" class="secondary-btn">导出为 HTML</button>
            <button id="export-md-btn" class="secondary-btn">导出为 Markdown</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
